name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo test --no-default-features --locked --all-targets
      - run: cargo clippy --no-default-features --all-targets --locked -- -D warnings
  desktop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-macos-15-tauri-2.12.4-${{ hashFiles('Cargo.lock') }}
      - name: Install packaging CLI
        run: |
          if [ "$(cargo tauri --version 2>/dev/null || true)" != 'tauri-cli 2.12.4' ]; then
            cargo install tauri-cli --version 2.12.4 --locked --force
          fi
      - run: cargo test --locked --all-targets
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: scripts/bundle-macos.sh
      - run: ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/GPExit.app target/GPExit-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GPExit-macOS
          path: target/GPExit-macOS.zip
