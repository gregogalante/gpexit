name: Rust checks

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo test --no-default-features --locked
      - run: cargo clippy --no-default-features --all-targets --locked -- -D warnings
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: scripts/bundle-macos.sh
      - run: ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/GPExit.app target/GPExit-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GPExit-macOS
          path: target/GPExit-macOS.zip
