name: Release builds

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]*'
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tauri.conf.json'
      - 'icons/**'
      - 'platform/**'
      - 'scripts/**'
      - 'examples/release_artifacts.rs'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAURI_CLI_VERSION: 2.12.4

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        name: Validate package and release version
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gpexit-desktop") | .version')
          test -n "$version" && test "$version" != null
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must match Cargo.toml: expected v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64
            bundles: app,dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config curl file libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: package-${{ runner.os }}-${{ matrix.target }}-tauri-${{ env.TAURI_CLI_VERSION }}-${{ hashFiles('Cargo.lock') }}
      - name: Install pinned Tauri packaging CLI
        shell: bash
        run: |
          if [[ "$(cargo tauri --version 2>/dev/null || true)" != "tauri-cli $TAURI_CLI_VERSION" ]]; then
            cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked --force
          fi
      - name: Validate source
        run: cargo fmt -- --check
      - name: Test native application
        run: cargo test --locked --all-targets
      - name: Check native application
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Remove cached package outputs
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rm -rf "target/$TARGET/release/bundle"
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          MAC_CERTIFICATE: ${{ github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE || '' }}
          MAC_CERTIFICATE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          MAC_SIGNING_IDENTITY: ${{ github.ref_type == 'tag' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          MAC_APPLE_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_ID || '' }}
          MAC_APPLE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.APPLE_PASSWORD || '' }}
          MAC_APPLE_TEAM_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if [[ -n "$MAC_CERTIFICATE" ]]; then
            : "${MAC_SIGNING_IDENTITY:?Configure APPLE_SIGNING_IDENTITY}"
            : "${MAC_APPLE_ID:?Configure APPLE_ID for notarization}"
            : "${MAC_APPLE_PASSWORD:?Configure APPLE_PASSWORD for notarization}"
            : "${MAC_APPLE_TEAM_ID:?Configure APPLE_TEAM_ID for notarization}"
            export APPLE_CERTIFICATE="$MAC_CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$MAC_SIGNING_IDENTITY"
            export APPLE_ID="$MAC_APPLE_ID"
            export APPLE_PASSWORD="$MAC_APPLE_PASSWORD"
            export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
          else
            export APPLE_SIGNING_IDENTITY=-
          fi
          cargo tauri build --ci --target "$TARGET" --bundles "$BUNDLES" -- --locked
      - name: Package Windows and Linux
        if: runner.os != 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: cargo tauri build --ci --target "$TARGET" --bundles "$BUNDLES" -- --locked
      - name: Collect packages and checksums
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
        run: cargo run --release --no-default-features --locked --example release_artifacts -- "target/$TARGET/release/bundle" dist "$LABEL"
      - uses: actions/upload-artifact@v4
        with:
          name: GPExit-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  draft:
    name: Create draft release
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: GPExit-*
          path: dist
          merge-multiple: true
      - name: Verify packages and create draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat SHA256SUMS-*.txt | LC_ALL=C sort > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          rm SHA256SUMS-*.txt
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft release-state.json)" != true ]]; then
              echo 'Refusing to overwrite an already published release.' >&2
              exit 1
            fi
          else
            flags=(--draft --verify-tag --title "GPExit $RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${flags[@]}"
          fi
          rm -f release-state.json
          gh release upload "$RELEASE_TAG" ./*.dmg ./*.exe ./*.msi ./*.AppImage ./*.deb SHA256SUMS.txt --clobber
